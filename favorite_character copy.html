<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>에반게리온 소개</title>
  <style>
    body {
      margin: 0;
      background-color: #0d0d0d;
      font-family: 'Arial', sans-serif;
      color: white;
      text-align: center;
    }

    .hero {
      position: relative;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .robot-img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .shine {
      content: "";
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(120deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.5) 50%, rgba(255,255,255,0.1) 100%);
      transform: skewX(-20deg);
      animation: shine 3s infinite;
    }

    @keyframes shine {
      0% {
        left: -75%;
      }
      100% {
        left: 125%;
      }
    }

    h1 {
      font-size: 3rem;
      margin-top: 2rem;
      color: #e62b4a;
    }
  </style>
</head>
<body>
  <div class="hero">
    <img class="robot-img" src="evangelion.png" alt="에반게리온" />
    <div class="shine"></div>
  </div>
  <h1>신세기 에반게리온</h1>
</body>
</html>
